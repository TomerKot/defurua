name: Щоденна публікація уроку німецької мови

on:
  schedule:
    # Запуск щодня о 07:00 UTC (це 09:00 за Київським часом взимку / 10:00 влітку)
    - cron: '0 7 * * *'
  # Можливість ручного запуску в один клік у вкладці Actions для перевірки
  workflow_dispatch:

# Дозволи для збереження оновленого файлу history.json у гілку
permissions:
  contents: write

jobs:
  publish_daily_lesson:
    runs-on: ubuntu-latest

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Встановлення шрифтів для генерації зображень
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Встановлення залежностей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Генерація та публікація уроку в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Збереження оновленої історії history.json у репозиторій
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.json
          if ! git diff --staged --quiet; then
            git commit -m "Автоматичне оновлення history.json [skip ci]"
            git push
          else
            echo "Змін у файлі history.json не виявлено."
          fi
