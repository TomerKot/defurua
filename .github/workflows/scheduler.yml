name: Автоматична публікація уроків німецької мови (6 разів на день)

on:
  schedule:
    # 1. 08:05 за Німеччиною (06:05 UTC) — «Слово дня» (Alltag & Grammatik)
    - cron: '5 6 * * *'
    # 2. 10:35 за Німеччиною (08:35 UTC) — «Жива розмовна фраза дня»
    - cron: '35 8 * * *'
    # 3. 13:05 за Німеччиною (11:05 UTC) — «Типова помилка українців»
    - cron: '5 11 * * *'
    # 4. 15:35 за Німеччиною (13:35 UTC) — «Живий ситуативний діалог»
    - cron: '35 13 * * *'
    # 5. 18:05 за Німеччиною (16:05 UTC) — «Офіційний лист (Musterbrief)»
    - cron: '5 16 * * *'
    # 6. 20:35 за Німеччиною (18:35 UTC) — «Вечірній Quiz-батл» (Poll)
    - cron: '35 18 * * *'

  # Можливість запустити будь-який формат вручну в один клік у GitHub Actions
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Оберіть тип публікації'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'morning'
          - 'phrase'
          - 'mistake'
          - 'dialogue'
          - 'letter'
          - 'quiz'

permissions:
  contents: write

jobs:
  publish_lesson:
    runs-on: ubuntu-latest

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Встановлення шрифтів для генерації зображень
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Встановлення залежностей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Генерація та публікація контенту в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --type "${{ inputs.post_type || 'auto' }}"

      - name: Збереження оновленої історії в репозиторій
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout main || git checkout -b main
          git add history.json docs/history.json
          if ! git diff --staged --quiet; then
            git commit -m "Автоматичне оновлення history.json [skip ci]"
            # Захист від конфліктів: підтягування нових комітів перед push із 3 спробами
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 2
            done
          else
            echo "Змін у history.json не виявлено."
          fi
