name: Автоматична публікація уроків німецької мови (3 рази на день)

on:
  schedule:
    # 1. Ранок: 07:00 UTC (09:00 за Києвом взимку) — «Слово дня» + Картка + Аудіо
    - cron: '0 7 * * *'
    # 2. День: 12:00 UTC (14:00 за Києвом взимку) — «Розмовна фраза дня» + Картка + Аудіо
    - cron: '0 12 * * *'
    # 3. Вечір: 17:00 UTC (19:00 за Києвом взимку) — «Інтерактивне Quiz-опитування» (Poll)
    - cron: '0 17 * * *'

  # Можливість запустити будь-який формат вручну в один клік у GitHub Actions
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Оберіть тип публікації'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'morning'
          - 'afternoon'
          - 'evening'

permissions:
  contents: write

jobs:
  publish_lesson:
    runs-on: ubuntu-latest

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Встановлення шрифтів для генерації зображень
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Встановлення залежностей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Генерація та публікація контенту в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --type "${{ inputs.post_type || 'auto' }}"

      - name: Збереження оновленої історії в репозиторій
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout main || git checkout -b main
          git add history.json
          if ! git diff --staged --quiet; then
            git commit -m "Автоматичне оновлення history.json [skip ci]"
            # Захист від конфліктів: підтягування нових комітів перед push із 3 спробами
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 2
            done
          else
            echo "Змін у history.json не виявлено."
          fi
